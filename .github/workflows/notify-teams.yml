name: Daily Teams Leaderboard Notification

on:
  schedule:
    # Send at 08:00 UTC daily = 10:00 AM Germany (CEST)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit leaderboard.json

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch top 10 and write leaderboard.json
        env:
          SUPABASE_URL: https://neqdmjxbjwxmoiaxzkiy.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP_URL: https://wc2026-predictor-dmz.pages.dev
        run: |
          node << 'EOF'
          const fs   = require('fs')
          const URL  = process.env.SUPABASE_URL
          const KEY  = process.env.SUPABASE_KEY
          const APP  = process.env.APP_URL

          async function main() {
            // Fetch top 10 players
            const r = await fetch(
              `${URL}/rest/v1/players?select=display_name,total_pts,stage_pts,special_pts&order=total_pts.desc&limit=10`,
              { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } }
            )
            const players = await r.json()
            if (!Array.isArray(players)) { console.log('No data'); return }

            const dayNum  = Math.max(1, Math.floor((Date.now() - new Date('2026-06-11T19:00:00Z').getTime()) / 86400000) + 1)
            const today   = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
            const gap     = players.length > 1 ? (players[0]?.total_pts||0) - (players[1]?.total_pts||0) : 0
            const medals  = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟']

            const data = {
              generated_at: new Date().toISOString(),
              day: dayNum,
              date: today,
              total_players: players.length,
              gap_1st_2nd: gap,
              app_url: APP,
              top10: players.map((p, i) => ({
                rank: i + 1,
                medal: medals[i],
                name: p.display_name,
                total_pts: p.total_pts || 0,
                match_pts: p.stage_pts || 0,
                special_pts: p.special_pts || 0
              }))
            }

            fs.writeFileSync('leaderboard.json', JSON.stringify(data, null, 2))
            console.log(`✅ leaderboard.json written — Day ${dayNum}, ${players.length} players, leader: ${players[0]?.display_name} ${players[0]?.total_pts}pts`)
          }

          main().catch(e => { console.error(e.message); process.exit(1) })
          EOF

      - name: Commit leaderboard.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          git diff --staged --quiet || git commit -m "chore: update leaderboard.json [skip ci]"
          git push
