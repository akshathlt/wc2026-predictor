name: Auto Sync FIFA Results + Recalculate Points

on:
  schedule:
    # Runs every 30 minutes during tournament hours (06:00-23:30 UTC)
    - cron: '0,30 6-23 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync FIFA results and recalculate points
        env:
          SUPABASE_URL: https://neqdmjxbjwxmoiaxzkiy.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node << 'EOF'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SERVICE_KEY  = process.env.SUPABASE_SERVICE_KEY;
          const FIFA_URL = 'https://api.fifa.com/api/v3/calendar/matches?language=en&count=200&idSeason=285023&fromDate=2026-06-28';

          const headers = {
            'apikey': SERVICE_KEY,
            'Authorization': `Bearer ${SERVICE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          };

          async function query(path, opts = {}) {
            const { headers: extraHeaders, ...restOpts } = opts
            const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
              headers: { ...headers, 'Prefer': 'return=minimal', ...(extraHeaders || {}) },
              ...restOpts
            })
            if (!r.ok) { const t = await r.text(); throw new Error(`${r.status} ${path}: ${t}`); }
            return restOpts.method && restOpts.method !== 'GET' ? null : r.json();
          }

          async function logSync(updated, skipped, message) {
            try {
              await fetch(`${SUPABASE_URL}/rest/v1/sync_log`, {
                method: 'POST',
                headers: { ...headers, 'Prefer': 'return=minimal' },
                body: JSON.stringify({ source: 'github_action', matches_updated: updated, matches_skipped: skipped, message })
              })
              console.log('✅ Sync log written')
            } catch(e) { console.warn('Log write failed (non-fatal):', e.message) }
          }

          async function main() {
            // 1. Fetch ALL FIFA matches (group + knockout TBD)
            console.log('Fetching FIFA API...');
            const fifa = await fetch(FIFA_URL).then(r => r.json());
            const allMatches = fifa.Results || [];
            const fifaWithScores = allMatches.filter(m => m.HomeTeamScore != null && m.AwayTeamScore != null);
            console.log(`Total FIFA matches: ${allMatches.length}, with scores: ${fifaWithScores.length}`);

            // 2. Get DB matches
            const dbMatches = await query('matches?select=id,match_num,home_goals,away_goals,home_team,away_team,stage');
            console.log(`DB matches: ${dbMatches.length}`);

            // 3. Upsert ALL matches including TBD knockouts so UI can show them
            const STAGE_MAP = {
              'First Stage': 'group',
              'Round of 32': 'r32',
              'Round of 16': 'r32',
              'Quarter-final': 'qf',
              'Semi-final': 'sf',
              'Play-off for third place': '3rd',
              'Final': 'final'
            }
            let inserted = 0;
            for (const fm of allMatches) {
              const dbMatch = dbMatches.find(m => m.match_num === fm.MatchNumber);
              const stageName = fm.StageName?.[0]?.Description || ''
              const stage = STAGE_MAP[stageName] || (stageName.includes('Final') ? 'final' : stageName.includes('Semi') ? 'sf' : stageName.includes('Quarter') ? 'qf' : stageName.includes('16') || stageName.includes('32') ? 'r32' : 'group')
              const homeTeam = fm.Home?.ShortClubName || fm.PlaceHolderA || 'TBD'
              const awayTeam = fm.Away?.ShortClubName || fm.PlaceHolderB || 'TBD'
              const matchDate = fm.Date ? fm.Date.split('T')[0] : null
              const matchTime = fm.Date ? fm.Date.split('T')[1]?.substring(0,5) : null
              const groupName = fm.GroupName?.[0]?.Description?.replace('Group ','') || null

              if (!dbMatch && stage !== 'group') {
                // Insert knockout matches not in DB yet
                const newMatch = {
                  match_num: fm.MatchNumber,
                  stage,
                  group_name: groupName,
                  home_team: homeTeam,
                  away_team: awayTeam,
                  match_date: matchDate,
                  match_time: matchTime,
                  locked: false
                }
                await query('matches', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify(newMatch) })
                inserted++
              } else if (dbMatch) {
                // Update team names if they changed from TBD to real
                const needsUpdate = (dbMatch.home_team === 'TBD' && homeTeam !== 'TBD') ||
                                    (dbMatch.away_team === 'TBD' && awayTeam !== 'TBD')
                if (needsUpdate) {
                  await query(`matches?id=eq.${dbMatch.id}`, { method: 'PATCH', body: JSON.stringify({ home_team: homeTeam, away_team: awayTeam }) })
                }
              }
            }
            if (inserted > 0) console.log(`✅ Inserted ${inserted} new knockout fixtures`)

            // 4. Sync scores for completed matches
            let updated = 0, skipped = 0;
            const dbMatchesRefresh = await query('matches?select=id,match_num,home_goals,away_goals');
            for (const fm of fifaWithScores) {
              const dbMatch = dbMatchesRefresh.find(m => m.match_num === fm.MatchNumber);
              if (!dbMatch) continue;
              if (dbMatch.home_goals === fm.HomeTeamScore && dbMatch.away_goals === fm.AwayTeamScore) { skipped++; continue; }

              const update = { home_goals: fm.HomeTeamScore, away_goals: fm.AwayTeamScore, locked: true, last_synced_at: new Date().toISOString() };
              if (fm.ResultType === 2 && fm.HomeTeamPenaltyScore != null) {
                update.penalty_winner = fm.HomeTeamPenaltyScore > fm.AwayTeamPenaltyScore
                  ? fm.Home?.ShortClubName : fm.Away?.ShortClubName;
              }
              await query(`matches?id=eq.${dbMatch.id}`, { method: 'PATCH', body: JSON.stringify(update) });
              console.log(`✅ Synced M${fm.MatchNumber}: ${fm.Home?.ShortClubName} ${fm.HomeTeamScore}-${fm.AwayTeamScore} ${fm.Away?.ShortClubName}`);
              updated++;
            }
            console.log(`Sync: ${updated} updated, ${skipped} already up to date`);

            if (updated === 0) {
              console.log('No new results — skipping recalculation');
              await logSync(0, skipped, `No new results. ${skipped} already up to date.`);
              return;
            }

            // 4. Recalculate points for all players
            console.log('Recalculating points...');
            const finishedMatches = await query('matches?select=*&home_goals=not.is.null');
            const allPreds = await query('match_predictions?select=*');

            const totals = {};
            for (const match of finishedMatches) {
              const mPreds = allPreds.filter(p => p.match_id === match.id);
              for (const pred of mPreds) {
                let pts = 0;
                const realDiff = match.home_goals - match.away_goals;
                const predDiff = pred.predicted_home - pred.predicted_away;
                if (Math.sign(predDiff) === Math.sign(realDiff)) pts += 2;
                if (predDiff === realDiff) pts += 1;
                if (pred.predicted_home === match.home_goals && pred.predicted_away === match.away_goals) pts += 2;
                let penPts = 0;
                const KNOCKOUT = ['r32','qf','sf','3rd','final'];
                if (KNOCKOUT.includes(match.stage) && match.home_goals === match.away_goals) {
                  if (predDiff === 0) penPts += 5;
                  if (match.penalty_winner && pred.penalty_winner === match.penalty_winner) penPts += 10;
                }
                if (pred.joker_used) { pts *= 2; penPts *= 2; }
                await query(`match_predictions?id=eq.${pred.id}`, {
                  method: 'PATCH', body: JSON.stringify({ total_pts: pts, penalty_pts: penPts })
                });
                totals[pred.player_id] = (totals[pred.player_id] || 0) + pts + penPts;
              }
            }

            // 5. Update player stage_pts, re-sum special pts from DB, update total
            const allPlayers = await query('players?select=id');
            const groupPreds  = await query('group_predictions?select=player_id,points_earned');
            const thirdPreds  = await query('third_place_picks?select=player_id,points_earned');
            const specialAns  = await query('special_answers?select=player_id,points_earned');

            const groupTotals = {}, thirdTotals = {}, specialTotals = {};
            for (const r of groupPreds)  groupTotals[r.player_id]   = (groupTotals[r.player_id]  || 0) + (r.points_earned || 0);
            for (const r of thirdPreds)  thirdTotals[r.player_id]   = (thirdTotals[r.player_id]  || 0) + (r.points_earned || 0);
            for (const r of specialAns)  specialTotals[r.player_id] = (specialTotals[r.player_id]|| 0) + (r.points_earned || 0);

            for (const pl of allPlayers) {
              const stage   = totals[pl.id] || 0;
              const special = (groupTotals[pl.id] || 0) + (thirdTotals[pl.id] || 0) + (specialTotals[pl.id] || 0);
              await query(`players?id=eq.${pl.id}`, {
                method: 'PATCH', body: JSON.stringify({ stage_pts: stage, special_pts: special, total_pts: stage + special })
              });
            }
            console.log(`✅ Recalculated points for ${Object.keys(totals).length} players`);
            await logSync(updated, skipped, `Synced ${updated} results, recalculated ${Object.keys(totals).length} players`);
          }

          main().catch(e => {
            console.error('ERROR:', e.message);
            // Log failure too
            fetch(`${SUPABASE_URL}/rest/v1/sync_log`, {
              method: 'POST',
              headers: {
                'apikey': SERVICE_KEY,
                'Authorization': `Bearer ${SERVICE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify({ source: 'github_action', matches_updated: 0, matches_skipped: 0, message: `ERROR: ${e.message}` })
            }).catch(()=>{});
            process.exit(1);
          });
          EOF

